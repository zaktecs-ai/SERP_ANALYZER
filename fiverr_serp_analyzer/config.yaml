browser:
  headless: false          # locked — app refuses to start if set true
  page_timeout: 90         # seconds — Fiverr needs more time with stealth browser

collection:
  top_n: 20
  delay_min: 3
  delay_max: 7
  keyword_pause_min: 8
  keyword_pause_max: 15
  max_retries: 2
  max_keywords_per_run: 0  # 0 = unlimited
  max_challenges_per_run: 3

  # Tier 2: Gig detail page scraping (deep competitive intelligence)
  collect_gig_details: true    # true = scrape detail pages, false = SERP only
  max_detail_pages: 10         # how many gig detail pages per keyword (1-20)
  detail_delay_min: 4          # min seconds between detail page visits
  detail_delay_max: 8          # max seconds between detail page visits

reports:
  generate_competitive_report: true  # generate competitive intel markdown report

interaction:
  natural_scroll: true
  mouse_movement: true
  idle_probability: 0.2

analysis:
  demand_weight: 0.25
  intent_weight: 0.20
  relevance_weight: 0.20
  competition_weight: 0.25
  serp_weakness_weight: 0.10